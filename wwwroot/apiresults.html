<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="application/json; charset=utf-8">
    <title>API Response</title>
</head>
<body>
<pre id="json-output"></pre>
<script>
    (function() {
        // Retrieve JSON from sessionStorage
        const jsonResponse = sessionStorage.getItem('apiResponse');
        
        if (jsonResponse) {
            // Clear sessionStorage after reading
            sessionStorage.removeItem('apiResponse');
            
            // Output pure JSON to the page
            document.getElementById('json-output').textContent = jsonResponse;
        } else {
            // No data found
            const errorResponse = JSON.stringify({
                success: false,
                error: 'No API response data found. Please visit /api with required parameters.',
                code: 'NO_DATA',
                status: 404
            }, null, 2);
            
            document.getElementById('json-output').textContent = errorResponse;
        }
    })();
</script>
</body>
</html>
